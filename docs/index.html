<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Countdown OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="logo-mark">24</div>
      <h1>Life Countdown OS</h1>
      <p>اليوم رصيد زمني محدود. سجّل دخولك، وزّع ساعاتك، وشاهد كيف يتحول وقتك إلى قرارات أوضح.</p>
    </section>

    <section class="auth-card" aria-label="تسجيل الدخول أو إنشاء حساب">
      <div class="tabs" role="tablist">
        <button class="tab-button active" id="loginTab" type="button" role="tab" aria-selected="true">تسجيل دخول</button>
        <button class="tab-button" id="registerTab" type="button" role="tab" aria-selected="false">حساب جديد</button>
      </div>

      <form id="authForm" class="auth-form">
        <div class="field hidden" id="nameField">
          <label for="name">الاسم</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="اسمك">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <button class="primary-button full" id="submitButton" type="submit">دخول</button>
        <p class="form-message" id="authMessage" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
