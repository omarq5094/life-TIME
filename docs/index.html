<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Countdown OS | تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <span class="status-dot active"></span>
          <div>
            <p class="eyebrow">Life Countdown OS</p>
            <h1>ادخل إلى رصيد يومك</h1>
          </div>
        </div>

        <p class="auth-intro">
          سجّل دخولك حتى تُحفظ بياناتك في Google Sheets وتقدر ترجع لها لاحقًا.
        </p>

        <div class="auth-tabs" aria-label="اختيار نوع الدخول">
          <button type="button" class="active" id="showLoginButton">تسجيل دخول</button>
          <button type="button" id="showRegisterButton">حساب جديد</button>
        </div>

        <form id="authForm" class="auth-form">
          <label id="nameField" class="hidden">
            الاسم
            <input id="displayName" type="text" maxlength="40" placeholder="مثال: سعيد" autocomplete="name" />
          </label>

          <label>
            Email
            <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required />
          </label>

          <label>
            Password
            <input id="password" type="password" minlength="6" placeholder="6 أحرف على الأقل" autocomplete="current-password" required />
          </label>

          <button type="submit" id="authSubmitButton">دخول</button>
        </form>

        <p id="authMessage" class="auth-message" role="status"></p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
